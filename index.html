<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f17">
<title>Zero Cap – Overené eko voľby, ktoré sa oplatia</title>
<style>
:root{
  --green:#16a34a; --green-d:#15803d; --green-l:#dcfce7; --green-xl:#f0fdf4;
  --ink:#0f1f17; --ink2:#334155; --muted:#64748b; --line:#e5e7eb;
  --warm:#f97316; --warm-l:#ffedd5; --bg:#f6f7f4; --card:#fff;
  --r:20px; --shadow:0 6px 24px rgba(15,31,23,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#0f1f17;display:flex;justify-content:center;align-items:center;min-height:100vh}
@media(min-width:500px){body{background:radial-gradient(circle at 20% 20%,#1e3a2a,#0b1510 70%);padding:24px}}
.phone{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.phone{height:min(860px,calc(100vh - 48px));border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px #111,0 0 0 12px #333}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo .mark{width:30px;height:30px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.logo small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0}
.toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;background:#fff;border:1px solid var(--line);padding:5px 8px 5px 10px;border-radius:999px}
.sw{width:30px;height:18px;border-radius:9px;background:#cbd5e1;position:relative;transition:.25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--warm)} .toggle.on .sw::after{left:14px}
main{flex:1;overflow-y:auto;padding:4px 16px 100px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:0}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav{position:absolute;left:10px;right:10px;bottom:10px;background:var(--ink);border-radius:24px;display:flex;justify-content:space-around;padding:8px 4px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s}
nav.hide{transform:translateY(140%)}
nav button{flex:1;background:none;border:0;color:#94a3b8;font:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:16px;transition:.2s}
nav button svg{width:22px;height:22px}
nav button.active{color:#fff}
nav button.active svg{color:#4ade80}
nav button.scan{color:#fff}
nav button.scan .fab{width:46px;height:46px;margin-top:-26px;border-radius:16px;background:var(--green);display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,163,74,.5);border:4px solid var(--ink)}
h1{font-size:24px;letter-spacing:-.6px;line-height:1.15}
h2{font-size:17px;letter-spacing:-.3px;margin:20px 2px 10px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(140deg,#0f1f17 0%,#14532d 100%);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(74,222,128,.15)}
.hero .pts{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero .pts span{font-size:16px;font-weight:600;color:#86efac;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill.warm{background:var(--warm-l);color:#9a3412}
.pill.green{background:var(--green-l);color:var(--green-d)}
.bar{height:9px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#a3e635);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card .bar{background:#eef2ef}
.card .bar>i{background:var(--green)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.mini .ic{font-size:20px}
.mini b{display:block;font-size:22px;letter-spacing:-.5px;margin-top:4px}
.mini small{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2;display:block}
.note{font-size:11px;color:var(--muted);line-height:1.4;padding:10px 12px;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;margin:10px 0}
.note b{color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;font:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:16px;cursor:pointer;transition:transform .12s,opacity .2s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.green{background:var(--green)} .btn.warm{background:var(--warm)} .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.scanbig{height:210px;border-radius:28px;background:linear-gradient(150deg,var(--green),#0f766e);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:800;cursor:pointer;border:0;width:100%;box-shadow:0 14px 34px rgba(22,163,74,.35);position:relative;overflow:hidden;font-family:inherit}
.scanbig .frame{width:70px;height:70px;position:relative}
.scanbig::before{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.7);top:20%;animation:sweep 2.4s ease-in-out infinite;box-shadow:0 0 18px #fff}
@keyframes sweep{0%,100%{top:15%}50%{top:85%}}
.scanbig small{font-size:12px;font-weight:600;opacity:.85}
input,textarea,select{width:100%;font:inherit;font-size:14px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;font-family:ui-monospace,Menlo,monospace;background:#eef2ef;border:0;padding:5px 8px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.receipt{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);font-size:13px;position:relative}
.receipt .head{text-align:center;border-bottom:1.5px dashed #cbd5e1;padding-bottom:10px;margin-bottom:8px}
.receipt .head b{font-size:15px}
.receipt .meta{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;margin:3px -6px}
.item.eco{background:var(--green-l);animation:pop .5s ease both}
.item .nm{flex:1}
.item .tag{font-size:10.5px;color:var(--green-d);font-weight:700;display:block}
.item .pp{font-weight:800;color:var(--green-d);font-size:12px;white-space:nowrap}
.item .pr{font-variant-numeric:tabular-nums;color:var(--ink2)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.total{display:flex;justify-content:space-between;border-top:1.5px dashed #cbd5e1;margin-top:8px;padding-top:10px;font-weight:700}
.earn{text-align:center;padding:18px;border-radius:22px;background:linear-gradient(140deg,#0f1f17,#14532d);color:#fff;margin-bottom:12px}
.earn .big{font-size:46px;font-weight:900;letter-spacing:-1.5px;color:#4ade80}
.verify{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 10px;gap:16px}
.spinner{width:72px;height:72px;border-radius:50%;border:6px solid var(--green-l);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;text-align:left;font-size:14px;width:100%;max-width:300px}
.steps li{padding:8px 0;color:#94a3b8;display:flex;gap:10px;align-items:center;transition:color .3s}
.steps li.done{color:var(--ink)} .steps li.done .d{background:var(--green);color:#fff;border-color:var(--green)}
.steps li.act{color:var(--ink);font-weight:700}
.steps .d{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.badge-ok{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green-d);background:var(--green-l);padding:5px 10px;border-radius:999px}
.alert{background:#fef2f2;color:#991b1b;border-radius:18px;padding:16px;font-weight:600;text-align:center;border:1.5px solid #fecaca}
.voucher{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px;position:relative}
.voucher .vi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.voucher .vt{flex:1;min-width:0}
.voucher .vt b{font-size:14px;display:block;line-height:1.25}
.voucher .vt small{font-size:11.5px;color:var(--muted)}
.voucher .cost{font-size:12px;font-weight:800;color:var(--green-d)}
.ch{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.ch .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.ch .top b{font-size:14px}
.lb{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.lb .r{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:14px}
.lb .r:last-child{border:0}
.lb .r.me{background:var(--green-xl)}
.lb .pos{width:26px;height:26px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center;font-weight:800;font-size:12px}
.lb .r:nth-child(1) .pos{background:#fde68a} .lb .r:nth-child(2) .pos{background:#e2e8f0} .lb .r:nth-child(3) .pos{background:#fed7aa}
.lb .nm{flex:1;font-weight:700} .lb .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.lb .mbar{width:70px;height:6px;background:#f1f5f9;border-radius:6px;overflow:hidden} .lb .mbar i{display:block;height:100%;background:var(--green)}
.lb .v{font-weight:800;font-variant-numeric:tabular-nums;width:52px;text-align:right}
.seg{display:flex;background:#e9ece8;border-radius:14px;padding:4px;gap:4px;margin:4px 0 10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:700;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.legend span{flex:1} .legend b{font-variant-numeric:tabular-nums}
.link{color:var(--green-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.kpi{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi small{font-size:11px;color:var(--muted);font-weight:600;display:block}
.kpi b{font-size:24px;letter-spacing:-.6px;display:block;margin-top:3px}
.kpi em{font-style:normal;font-size:11px;font-weight:700;color:var(--green-d)}
.partner-hero{background:linear-gradient(140deg,#7c2d12,#f97316);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px}
.roi{white-space:nowrap;font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1}
.modal-bg{position:absolute;inset:0;background:rgba(15,31,23,.55);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;animation:fadebg .25s}
@keyframes fadebg{from{opacity:0}}
.modal{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:20px 20px 28px;animation:up .35s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:5px;background:#e2e8f0;margin:-6px auto 14px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:25;pointer-events:none;animation:fall 1.8s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
.cam{position:absolute;inset:0;background:#000;z-index:22;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .box{position:absolute;left:50%;top:42%;width:220px;height:220px;transform:translate(-50%,-50%);border:3px solid #4ade80;border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.cam .ctl{position:absolute;bottom:30px;left:20px;right:20px;text-align:center;color:#fff;font-size:13px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.ideabox{background:linear-gradient(140deg,var(--warm-l),#fff7ed);border-radius:20px;padding:16px;margin-top:6px;border:1px solid #fed7aa}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.levels{display:flex;justify-content:space-between;font-size:10px;color:#a7f3d0;margin-top:6px;font-weight:600}
/* ---- v2: Plus, Komunita, Eko skóre ---- */
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #4ade80;outline-offset:2px}
.logo small{max-width:108px;line-height:1.2}
.toggle{white-space:nowrap}
header{padding:14px 14px 10px}
.hdr-r{display:flex;align-items:center;gap:6px}
.pluspill{border:0;font:inherit;font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;cursor:pointer;background:var(--ink);color:#bef264;white-space:nowrap;box-shadow:0 2px 8px rgba(15,31,23,.2);transition:.2s}
.pluspill.on{background:#bef264;color:var(--ink)}
nav button{font-size:9.5px;letter-spacing:-.1px}
.seg.four button{font-size:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.seg.four button .f2{margin:0}
.logo>div:last-child{white-space:nowrap}.logo small{white-space:normal}
.hdr-r{gap:4px}.hdr-r .toggle{padding:5px 6px 5px 8px}
/* Fáza 2 odznak */
.f2{display:inline-block;font-size:9px;font-weight:800;line-height:1;letter-spacing:.2px;padding:3px 6px;border-radius:999px;background:#ede9fe;color:#5b21b6;margin-left:6px;vertical-align:middle;white-space:nowrap;font-style:normal}
.pluspill .f2{margin-left:5px;font-size:8px;padding:2px 5px}
/* Univerzálna mena + uvítací bonus */
.rate{display:flex;gap:12px;align-items:center;background:var(--green-xl);border:1px solid #bbf7d0;color:var(--ink);border-radius:18px;padding:12px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.35}
.rate .ri{font-size:24px}
.rate b{color:var(--green-d);font-size:15px}
.rate small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.welcome{display:flex;gap:12px;align-items:center;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:20px;padding:12px;margin-bottom:6px}
.welcome .vi{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0;background:#fef3c7}
.welcome .vt{flex:1;min-width:0}
.welcome .vt b{font-size:13.5px;display:block;line-height:1.3;margin-top:2px}
.welcome .vt small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.welcome .wtag{font-size:10px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.4px}
/* Partner: limit zliav */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.stepper .sv{font-size:26px;font-weight:800;letter-spacing:-.6px}
.stepper .sv small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid #d6dbd6;background:#fff;font:inherit;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}
.stepper button:disabled{opacity:.4;cursor:default}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.fr{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px;animation:pop .4s ease both}
.fr .fi{flex:1;min-width:0}
.fr .fi b{font-size:14px;display:block}
.fr .fi small{font-size:11.5px;color:var(--muted)}
.fr .bar{height:6px;margin-top:6px}
.stat{text-align:right;font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;line-height:1.3}
.stat b{display:block;font-size:17px;color:var(--ink)}
.lb .av{width:30px;height:30px;border-radius:10px;font-size:11px}
.tagS{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:#fef3c7;color:#92400e;margin-top:6px}
.tagM{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--green-l);color:var(--green-d);margin-top:6px}
.ev{display:flex;gap:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px;animation:pop .4s ease both}
.evdate{width:50px;border-radius:14px;background:var(--green-xl);text-align:center;padding:7px 0;flex-shrink:0;align-self:flex-start}
.evdate b{font-size:20px;display:block;line-height:1.1}
.evdate small{font-size:10px;text-transform:uppercase;font-weight:800;color:var(--green-d)}
.ev .eb{flex:1;min-width:0}
.ev .eb b{font-size:14px;display:block;line-height:1.25}
.ev .eb .sub{font-size:11.5px;margin-top:3px}
.ev .eact{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn.sm.on{background:var(--green-l);color:var(--green-d)}
.formgrid{display:grid;gap:10px;margin-top:12px}
.fl{font-size:12px;font-weight:700;color:var(--ink2);display:grid;gap:4px}
.bcats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bcat{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;font:inherit;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2;text-align:center;transition:.15s}
.bcat span{font-size:20px}
.bcat.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.bcats.locked .bcat{opacity:.5}
.x2{display:inline-block;font-style:normal;font-size:10px;font-weight:800;background:#bef264;color:var(--ink);padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.bcat .x2{position:absolute;top:-7px;right:-4px;margin:0}
.lockwrap{position:relative;overflow:hidden}
.lockwrap .blur{filter:blur(5px);pointer-events:none;user-select:none;opacity:.8}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.4);text-align:center;padding:10px;font-size:14px}
.plusad{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin:14px 0 12px;position:relative;overflow:hidden}
.plusad::after{content:"✦";position:absolute;right:14px;top:4px;font-size:60px;color:rgba(190,242,100,.18)}
.plusad p{font-size:13px;color:#cbd5e1;margin:6px 0 12px;line-height:1.45;position:relative;z-index:1}

function findReceipt(input){
  var v=String(input||"").trim().toUpperCase().replace(/\s/g,"");
  if(!v) return null;
  for(var i=0;i<RECEIPTS.length;i++){ var id=RECEIPTS[i].id.toUpperCase(); if(id===v || (v.length>=6 && id.indexOf(v)===0) || v.indexOf(id)>=0) return RECEIPTS[i]; }
  return null;
}
/* normalizácia: malé písmená + bez diakritiky */
function norm(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function kwHit(text, kw){
  kw=norm(kw); if(!kw) return false;
  if(kw.length<=3) return new RegExp("(^|[^a-z0-9])"+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)").test(text);
  return text.indexOf(kw)>=0;
}
function ecoMatch(name){
  var R=CONFIG.rules, text=norm(name);
  for(var k in R){
    var rule=R[k];
    if(rule.exclude && rule.exclude.some(function(x){return kwHit(text,x);})) continue;
    if(rule.keywords.some(function(kw){return kwHit(text,kw);})) return k;
  }
  return null;
}
function analyze(r){
  var R=CONFIG.rules, lines=[], perAction={}, pts=0;
  r.items.forEach(function(it){
    var hit=ecoMatch(it.n), phase2=false;
    var p=0;
    if(hit && R[hit].phase2){ phase2=hit; hit=null; }   /* Fáza 2 (Munch): zobrazí sa, ale bez bodov a bez započítania */
    var mult=boostMult(hit);
    if(hit){ var n=Math.min(Math.max(1,Math.floor(it.q)), CONFIG.maxPerActionPerReceipt-(perAction[hit]||0)); if(n>0){ perAction[hit]=(perAction[hit]||0)+n; p=n*R[hit].points*mult; } }
    pts+=p; lines.push({n:it.n,q:it.q,p:it.p,eco:hit,phase2:phase2,pts:p,boost:p>0&&mult>1});
  });
  var total=r.items.reduce(function(a,it){return a+it.q*it.p;},0);
  var co2=0; for(var a in perAction){ co2+=perAction[a]*R[a].co2g; }
  var boosted=lines.some(function(l){return l.boost;});
  return {r:r,lines:lines,pts:pts,perAction:perAction,total:total,co2:co2,boosted:boosted};
}

function showError(title,msg){ S.tab="scan"; S.busy=false; S.lastResult={err:{title:title,msg:msg}}; render(); }

/* Z textu QR / ručne zadaného reťazca vytiahne online ID (O-<32 hex>) alebo rozpozná offline QR (OKP:...) */
function parseReceiptCode(raw){
  var s=String(raw||"").trim();
  var m=/O-[0-9A-F]{32}/i.exec(s);
  if(m) return {kind:"online", id:m[0].toUpperCase()};
  if(/^OKP:/i.test(s) || /(^|[^A-Z])OKP:/i.test(s)){
    var p=s.replace(/^.*?OKP:/i,"").split(":");
    return {kind:"offline", cashRegisterCode:p[0], date:p[1], receiptNumber:p[2], total:p[3]};
  }
  return {kind:"unknown"};
}
/* "23.06.2026 19:43:44" alebo ISO -> Date */
function parseSkDate(s){
  if(!s) return null;
  var m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(String(s).trim());
  var d=m? new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)) : new Date(s);
  return isNaN(d.getTime())? null : d;
}
function ekasaFetch(id){
  var ctl=("AbortController" in window)? new AbortController():null, to=null;
  if(ctl) to=setTimeout(function(){ ctl.abort(); }, CONFIG.ekasa.timeoutMs);
  return fetch(CONFIG.ekasa.url,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({receiptId:id}),signal:ctl?ctl.signal:undefined})
    .then(function(resp){ clearTimeout(to); return resp.text().then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} return {status:resp.status,json:j}; }); },
          function(e){ clearTimeout(to); throw e; });
}
/* eKasa odpoveď -> formát appky (vráti {r} alebo {err:[nadpis,text]}) */
function mapEkasa(id,json){
  var raw=json && json.receipt;
  if(!raw) return {err:["Bloček sa v eKasa nenašiel","Skontroluj ID (O- a 32 znakov). Bloček sa môže objaviť v eKasa až po pár minútach."]};
  var items=(raw.items||[]);
  var total=Number(raw.totalPrice);
  var allV=items.length>0 && items.every(function(i){return String(i.itemType||"").toUpperCase()==="V";});
  if(total<0 || allV || raw.referenceReceiptId) return {err:["Vratka sa nepočíta","Za vrátený tovar (vratku) body nedávame – iba za reálny nákup."]};
  var d=parseSkDate(raw.issueDate);
  if(!d) return {err:["Nepodarilo sa overiť dátum","Bloček nemá čitateľný dátum vystavenia."]};
  var age=(Date.now()-d.getTime())/86400000;
  if(age>CONFIG.ekasa.maxAgeDays) return {err:["Bloček je starší ako "+CONFIG.ekasa.maxAgeDays+" dní","Body sa dajú získať iba za čerstvé bločky."]};
  if(age<-1) return {err:["Neplatný dátum bločku","Dátum vystavenia je v budúcnosti."]};
  var mapped=items.filter(function(i){ return Number(i.price)>=0 && String(i.itemType||"").toUpperCase()!=="V"; }).map(function(i){
    var q=Number(i.quantity)>0? Number(i.quantity):1, line=Number(i.price)||0;
    return { n:String(i.name==null?"":i.name).replace(/\s+/g," ").trim()||"(bez názvu)", q:q, p:line/q };
  });
  if(!mapped.length) return {err:["Bloček nemá položky","eKasa vrátila bloček bez položiek."]};
  var org=raw.organization||{}, unit=raw.unit||{};
  var street=[unit.streetName||org.streetName, unit.buildingNumber||unit.propertyRegistrationNumber||org.buildingNumber||org.propertyRegistrationNumber].filter(Boolean).join(" ");
  var addr=[street, unit.municipality||org.municipality].filter(Boolean).join(", ");
  var p2=function(n){ return (n<10?"0":"")+n; };
  return {r:{ id:id, live:true, type:"live",
    shop:org.name||unit.name||raw.name||"Predajca (eKasa)", addr:addr||"—", ico:raw.ico||org.ico||"—",
    time:p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes()),
    items:mapped }};
}
function liveVerify(id){
  if(S.busy) return;
  id=id.toUpperCase();
  if(S.used[id]){ S.tab="scan"; S.lastResult={dup:true,r:{id:id}}; render(); return; }
  S.busy=true; S.tab="scan"; S.lastResult=null; closeCamera();
  verifyShell(id,true); setStep(2);
  ekasaFetch(id).then(function(res){
    if(!res.json) throw new Error("bad_response_"+res.status);
    var m=mapEkasa(id,res.json);
    if(m.err){ showError(m.err[0],m.err[1]); return; }
    setStep(3);
    setTimeout(function(){ setStep(4); setTimeout(function(){ S.busy=false; S.tab="scan"; finishScan(m.r); },450); },450);
  }).catch(function(){
    showError("Overenie cez eKasa sa nepodarilo","Skontroluj pripojenie na internet alebo skús o chvíľu znova. Medzitým môžeš vyskúšať demo bloček (offline režim).");
  });
}
/* Spoločný vstup: QR kamera / fotka / ručné ID */
function handleCode(raw){
  var demo=findReceipt(raw); if(demo){ startVerify(demo); return; }
  var p=parseReceiptCode(raw);
  if(p.kind==="online") liveVerify(p.id);
  else if(p.kind==="offline") showError("Offline bloček – zadaj ID","Tento QR je z offline bločku (OKP). Online ID (O-…) nájdeš na bločku pod QR kódom – zadaj ho ručne.");
  else showError("Toto nie je eKasa bloček","Nenašli sme ID v tvare O- a 32 znakov. Skús iný QR alebo zadaj ID ručne.");
}

function finishScan(r){
  if(S.used[r.id]){ S.lastResult={dup:true,r:r}; render(); return; }
  var res=analyze(r);
  S.used[r.id]=true;
  S.balance+=res.pts; S.lifetime+=res.pts;
  var actions=0;
  for(var k in res.perAction){ S.counts[k]=(S.counts[k]||0)+res.perAction[k]; actions+=res.perAction[k]; }
  S.platform.actions+=actions; S.platform.co2kg+=res.co2/1000;
  S.platform.cups+=res.perAction.cup||0; S.platform.plants+=res.perAction.plant||0; S.platform.packs+=res.perAction.refill||0;
  S.teams.forEach(function(t){ if(t.n===S.team) t.v+=actions; });
  S.people.forEach(function(p){ if(p.me) p.v+=actions; });
  S.today+=actions; S.week+=actions; S.weekCups+=res.perAction.cup||0;
  S.clubs.forEach(function(c){ if(c.joined) c.prog+=actions; });
  res.done=[];
  S.challenges.forEach(function(c){
    if(c.done) return; var add=res.perAction[c.rule]||0;
    if(add){ c.progress=Math.min(c.target,c.progress+add); if(c.progress>=c.target){ c.done=true; S.balance+=CONFIG.challengeBonus; S.lifetime+=CONFIG.challengeBonus; res.done.push(c.title); } }
  });
  if(res.pts>0) S.streak+= (S.streak===6?1:0);
  S.lastResult=res; render();
  if(res.pts>0) setTimeout(confetti,150);
}

/* Kamera / fotka – BarcodeDetector (ak je), inak jsQR z CDN */
var camStream=null, camLoop=null, camBusy=false, jsqrP=null;
function loadJsQR(){
  if(window.jsQR) return Promise.resolve(window.jsQR);
  if(jsqrP) return jsqrP;
  jsqrP=new Promise(function(res,rej){
    var sc=document.createElement("script"); sc.src=CONFIG.ekasa.jsqrUrl; sc.async=true;
    sc.onload=function(){ window.jsQR? res(window.jsQR) : rej(new Error("jsqr")); };
    sc.onerror=function(){ jsqrP=null; rej(new Error("jsqr_load")); };
    document.head.appendChild(sc);
  });
  return jsqrP;
}
function makeDetector(){
  if(!("BarcodeDetector" in window)) return null;
  try{ return new window.BarcodeDetector({formats:["qr_code"]}); }catch(e){ return null; }
}
/* zdroj (video / bitmap / obrázok) -> text QR alebo null */
function decodeSource(src,w,h,det){
  var viaJs=function(){
    return loadJsQR().then(function(jsQR){
      var max=900, sc=Math.min(1,max/Math.max(w,h)), cw=Math.round(w*sc), ch=Math.round(h*sc);
      var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
      var cx=cv.getContext("2d",{willReadFrequently:true}); cx.drawImage(src,0,0,cw,ch);
      var d=cx.getImageData(0,0,cw,ch), c=jsQR(d.data,cw,ch,{inversionAttempts:"attemptBoth"});
      return c? c.data : null;
    });
  };
  if(det){
    return det.detect(src).then(function(codes){ if(codes&&codes.length&&codes[0].rawValue) return codes[0].rawValue; return viaJs().catch(function(){return null;}); },function(){ return viaJs(); });
  }
  return viaJs();
}
function openCamera(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ toast("Kamera nie je dostupná – použi „Odfotiť QR“ alebo demo bloček."); return; }
  var det=makeDetector();
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(stream){
    camStream=stream;
    var wrap=document.createElement("div"); wrap.className="cam"; wrap.id="cam";
    wrap.innerHTML='<video playsinline muted autoplay></video><div class="box"></div><div class="ctl"><p style="margin-bottom:12px" id="camMsg">Namier na QR kód na bločku</p><button class="btn ghost" id="camClose">Zrušiť</button></div>';
    $("#phone").appendChild(wrap);
    var v=wrap.querySelector("video"); v.srcObject=stream; v.play().catch(function(){});
    $("#camClose").onclick=closeCamera;
    if(!det) loadJsQR().catch(function(){ closeCamera(); toast("Skener sa nepodarilo načítať – použi „Odfotiť QR“ alebo ručné ID."); });
    var lastUnknown=0;
    camLoop=setInterval(function(){
      if(camBusy||v.readyState<2||!v.videoWidth) return;
      camBusy=true;
      decodeSource(v,v.videoWidth,v.videoHeight,det).then(function(raw){
        camBusy=false;
        if(!raw||!$("#cam")) return;
        var p=parseReceiptCode(raw);
        if(p.kind==="unknown" && !findReceipt(raw)){ if(Date.now()-lastUnknown>2500){ lastUnknown=Date.now(); var m=$("#camMsg"); if(m) m.textContent="Toto nie je eKasa QR – skús iný"; } return; }
        closeCamera(); toast("QR načítaný ✓"); handleCode(raw);
      }).catch(function(){ camBusy=false; });
    },300);
  }).catch(function(){ toast("Prístup ku kamere zamietnutý – použi „Odfotiť QR“ alebo demo bloček."); });
}
function closeCamera(){
  clearInterval(camLoop); camLoop=null; camBusy=false;

function decodePhoto(file){
  if(!file) return;
  toast("Čítam QR z fotky…");
  var det=makeDetector();
  var load = ("createImageBitmap" in window)
    ? createImageBitmap(file)
    : new Promise(function(res,rej){ var u=URL.createObjectURL(file), im=new Image(); im.onload=function(){ res(im); }; im.onerror=rej; im.src=u; });
  load.then(function(img){
    var w=img.width||img.naturalWidth, h=img.height||img.naturalHeight;
    return decodeSource(img,w,h,det);
  }).then(function(raw){
    if(!raw){ showError("QR sa nepodarilo prečítať","Skús fotku zblízka a v dobrom svetle, alebo zadaj ID bločku ručne."); return; }
    handleCode(raw);
  }).catch(function(){ showError("QR sa nepodarilo prečítať","Fotku sa nepodarilo spracovať. Zadaj ID bločku ručne."); });
}

function pseudoQR(seed){
  var n=25, cell=8, s=hash(seed)||1, out='';
  function rnd(){ s^=s<<13; s^=s>>>17; s^=s<<5; return (s>>>0)/4294967296; }
  function finder(x,y){ return '<rect x="'+x*cell+'" y="'+y*cell+'" width="'+7*cell+'" height="'+7*cell+'" fill="#0f1f17"/><rect x="'+(x+1)*cell+'" y="'+(y+1)*cell+'" width="'+5*cell+'" height="'+5*cell+'" fill="#fff"/><rect x="'+(x+2)*cell+'" y="'+(y+2)*cell+'" width="'+3*cell+'" height="'+3*cell+'" fill="#0f1f17"/>'; }
  function inF(x,y){ return (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); }
  for(var y=0;y<n;y++) for(var x=0;x<n;x++){ if(!inF(x,y) && rnd()>.52) out+='<rect x="'+x*cell+'" y="'+y*cell+'" width="'+cell+'" height="'+cell+'" rx="1.5"/>'; }
  return '<svg viewBox="-16 -16 '+(n*cell+32)+' '+(n*cell+32)+'" width="210" height="210" style="display:block;margin:0 auto;background:#fff;border-radius:16px"><g fill="#0f1f17">'+out+'</g>'+finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>';
}

  '<p>2× body vo vybraných kategóriách, vlastné eventy s rezerváciou stola a denné Eko skóre. Appka ostáva zadarmo.</p>'+
  '<button class="btn" style="background:#bef264;color:#0f1f17;position:relative;z-index:1" data-plusopen>Pozrieť plány</button></div>';
}
function openPlus(){
  closeModal(); closePlus(); S.plusJust=false;
  var el=document.createElement("div"); el.className="plusfull"; el.id="plusModal";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","pfTitle");
  $("#phone").appendChild(el); renderPlus();

}
function closePlus(){ var m=$("#plusModal"); if(m) m.parentNode.removeChild(m); }
function renderPlus(){
  var el=$("#plusModal"); if(!el) return; var st=el.scrollTop;

  var plus=["Mesačne 2 zvýhodnené kategórie (2× body)","Vytváranie vlastných eventov a klubov + rezervácia stola u partnera","Denné Eko skóre a týždenný report","Exkluzívne výzvy a skorší prístup na sponzorované eventy",CONFIG.plus.fundShare+" % z predplatného ide do komunitného fondu (verejne)"];
  var li=function(a){ return a.map(function(x){return '<li>'+esc(x)+'</li>';}).join(""); };
  el.innerHTML='<div class="pf-top"><span class="pluspill'+(S.plus?' on':'')+'" aria-hidden="true">'+(S.plus?'Plus ✦ aktívne':'Zero Cap Plus ✦')+'</span><button class="pf-x" id="plusClose" aria-label="Zavrieť">✕</button></div>'+
  '<h1 class="pf-title" id="pfTitle">Vyber si plán'+F2+'</h1><p class="pf-sub">Zero Cap ostáva zadarmo. Plus pridáva extra funkcie.</p>'+
  (S.plusJust?'<div class="pf-ok" role="status">🎉 Plus je aktívny! Vyber si nižšie 2 zvýhodnené kategórie.</div>':'')+
  '<div class="pf-wrap">'+
   '<div class="plan"><div class="pn">Free'+(!S.plus?'<span class="ptag">Aktuálny plán</span>':'')+'</div><div class="ps">Eko voľby pre každý deň</div>'+
   '<div class="price">0 €<span>/ mesiac</span></div><button class="pbtn" id="stayFree">Zostať na Free ↗</button>'+
   '<ul>'+li(free)+'</ul><div class="pfoot">Aplikácia ostáva navždy zadarmo.</div></div>'+
   '<div class="plan hl"><div class="pn">Plus<span class="ptag g">'+(S.plus?'Aktuálny plán':'Študentská cena')+'</span></div><div class="ps">Viac bodov, komunita a štatistiky</div>'+
   '<div class="price">'+CONFIG.plus.price+'<span>/ mesiac</span></div>'+
   (S.plus?'<button class="pbtn" disabled>✓ Plus je aktívny</button>':'<button class="pbtn" id="activatePlus">Aktivovať Plus (demo) ↗</button>')+
   '<ul><li class="plushead">Všetko vo Free a navyše:</li><hr>'+li(plus)+'</ul>'+
   '<div class="pfoot">Liga a rebríčky rátajú overené akcie, nie body – Plus nekupuje víťazstvo. Zrušiť môžeš kedykoľvek.</div></div>'+
  '</div>'+boostCard(true);
  el.scrollTop=st;
}
function activatePlus(){
  S.plus=true; S.plusJust=true; updatePlusPill(); renderPlus(); render(); confetti();
  toast("✦ Zero Cap Plus aktivovaný (demo)");
  var el=$("#plusModal"); if(el) el.scrollTop=0;
}
function toggleBoost(k){
  if(!S.plus){ if(!$("#plusModal")) openPlus(); else toast("Najprv aktivuj Plus ✦"); return; }
  var i=S.boost.indexOf(k);
  if(i>=0) S.boost.splice(i,1); else { S.boost.push(k); if(S.boost.length>CONFIG.plus.boostCount) S.boost.shift(); }
  render(); renderPlus();
  toast(S.boost.length? "2× body: "+S.boost.map(function(x){return BOOST_LABEL[x];}).join(" + ") : "Vyber si 2 kategórie");
}

/* ============ TRANSPARENTNOSŤ ============ */
var SPLIT=[ {l:"Odmeny pre používateľov",v:60,c:"#16a34a"},{l:"Prevádzka a vývoj",v:20,c:"#0f1f17"},{l:"Overovanie / audit",v:10,c:"#f97316"},{l:"Komunitné projekty",v:10,c:"#a3e635"} ];
function donut(data,size){
  var r=60,c=2*Math.PI*r,off=0,segs='';
  data.forEach(function(d){ var len=d.v/100*c; segs+='<circle r="'+r+'" cx="90" cy="90" fill="none" stroke="'+d.c+'" stroke-width="26" stroke-dasharray="'+(len-2)+' '+(c-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)"/>'; off+=len; });
  return '<svg viewBox="0 0 180 180" width="'+size+'" height="'+size+'">'+segs+'<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="800" fill="#0f1f17">1 €</text><text x="90" y="106" text-anchor="middle" font-size="11" fill="#64748b">od partnera</text></svg>';
}
function viewTransparency(){
  var P=S.platform;
  return '<div class="view"><h1 style="margin:6px 2px 2px">Transparentnosť</h1><p class="sub" style="margin:0 2px 14px">Verejný dashboard · aktualizované priebežne</p>'+
  '<div class="card"><b style="font-size:15px">Kam ide každé euro</b><div class="row" style="gap:14px;margin-top:10px">'+donut(SPLIT,140)+
  '<div class="legend" style="flex:1">'+SPLIT.map(function(d){return '<div><i style="background:'+d.c+'"></i><span>'+d.l+'</span><b>'+d.v+' %</b></div>';}).join("")+'</div></div></div>'+
  '<h2>Overené spolu (celá komunita)</h2><div class="grid2">'+
  '<div class="kpi"><small>Overené eko akcie</small><b>'+fmt(P.actions)+'</b><em>cez eKasa</em></div>'+
  '<div class="kpi"><small>CO2e ušetrené</small><b>'+fmt(P.co2kg/1000,2)+' t</b><em>predbežné faktory</em></div>'+
  '<div class="kpi"><small>Jednorazové poháre</small><b>'+fmt(P.cups)+'</b><em>nevzniklo</em></div>'+
  '<div class="kpi"><small>Refill / bez obalu</small><b>'+fmt(P.packs)+'</b><em>obalov nevzniklo</em></div></div>'+
  '<div class="card" style="margin-top:12px"><b style="font-size:14px">Faktory na akciu</b>'+Object.keys(CONFIG.rules).map(function(k){var r=CONFIG.rules[k];
    return '<div class="flex-between" style="padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span>'+r.icon+' '+r.label+'</span>'+(r.phase2?F2:'<span class="sub">'+(r.co2g?'~'+fmt(r.co2g)+' g CO2e':'—')+' · '+r.points+' b</span>')+'</div>';}).join("")+
  '<p class="hint" style="margin-top:8px">⚠️ Predbežné faktory, metodika verejná. Hodnoty prejdú nezávislou revíziou.</p>'+
  '<p style="margin-top:10px"><span class="link" id="methodLink">Metodika (GHG Protocol – avoided emissions)</span></p></div>'+
  '<div class="card"><b style="font-size:14px">✦ Zero Cap Plus → komunitný fond</b><p class="sub" style="margin-top:6px">'+CONFIG.plus.fundShare+' % z každého predplatného Plus ide do komunitného fondu. Čerpanie zverejňujeme tu. Liga ráta overené akcie, nie body – Plus nekupuje víťazstvo.</p></div>'+
  '<div class="note">🔒 Overenie: každý bloček sa overuje cez eKasa (Finančná správa SR) a môže sa použiť len raz. Body nikdy za vyššiu útratu.</div></div>';
}
function showMethod(){
  modal('<h1 style="font-size:20px">Metodika</h1><p class="sub" style="margin:4px 0 12px">GHG Protocol – avoided emissions (porovnanie so základným scenárom)</p>'+
  '<div style="font-size:13.5px;line-height:1.55;color:var(--ink2)"><p><b>1. Základný scenár:</b> čo by si zvolil bez Zero Cap (jednorazový pohár, mäsité jedlo, nový obal).</p><p style="margin-top:8px"><b>2. Substitúcia:</b> overená položka z eKasa bločku nahrádza základný scenár.</p><p style="margin-top:8px"><b>3. Faktor:</b> rozdiel emisií (g CO2e) z verejných LCA databáz – zatiaľ predbežné hodnoty.</p><p style="margin-top:8px"><b>4. Konzervatívnosť:</b> limit '+CONFIG.maxPerActionPerReceipt+'× akcia na bloček, žiadne body za útratu (anti-rebound).</p><p style="margin-top:8px"><b>5. Audit:</b> 10 % rozpočtu ide na overovanie a nezávislý audit.</p></div><button class="btn" data-close style="margin-top:16px">Rozumiem</button>');
}

/* ============ POHĽAD PARTNERA ============ */
function viewPartner(){
  var cost=69, rev=101.5, roi=Math.round((rev-cost)/cost*100);
  var hours=[["7",18],["8",46],["9",38],["10",22],["11",17],["12",29],["13",24],["14",15],["15",19],["16",26],["17",12]], hmax=46;
  var bw=24,gap=6,H=110;
  var bars=hours.map(function(h,i){ var bh=Math.round(h[1]/hmax*H), x=i*(bw+gap); return '<rect x="'+x+'" y="'+(H-bh)+'" width="'+bw+'" height="'+bh+'" rx="6" fill="'+(h[1]===hmax?'#f97316':'#16a34a')+'"/><text x="'+(x+bw/2)+'" y="'+(H+14)+'" text-anchor="middle" font-size="10" fill="#64748b">'+h[0]+'</text>'; }).join("");
  var tops=[["Káva vo vlastnom pohári",58],["Rastlinné mlieko a jedlá",26],["Refill / bez obalu",16]];
  var earned=4100, redeemed=2000, lim=S.dailyLimit, usedToday=Math.min(6,lim);   /* demo čísla: 2 000 b = 20 € zliav z nákladov */
  var eMax=Math.max(earned,redeemed);
  return '<div class="view"><div class="partner-hero"><div style="font-size:12px;font-weight:700;opacity:.85">PARTNER · Kafé Komenius</div><h1 style="color:#fff;margin:4px 0 12px">November 2026</h1>'+
  '<div class="flex-between"><div><div style="font-size:12px;opacity:.85">ROI programu</div><div class="roi">+'+roi+' %</div></div><div style="text-align:right;font-size:12px;opacity:.9">Prínos '+eur(rev)+' (marža 94,50 + poháre 7)<br>Náklady '+eur(cost)+' (poplatok 49 + zľavy 20)</div></div></div>'+
  '<div class="grid2"><div class="kpi"><small>Noví zákazníci cez Zero Cap</small><b>45</b><em>+23 % m/m</em></div><div class="kpi"><small>Vracajúci sa zákazníci</small><b>41 %</b><em>vs. 27 % bez appky</em></div>'+
  '<div class="kpi"><small>Ušetrené poháre</small><b>100</b><em>≈ 2 kg CO2e · −7 € na obaloch</em></div><div class="kpi"><small>Uplatnené zľavy</small><b>13</b><em>Ø košík 6,10 €</em></div></div>'+
  '<div class="card" style="margin-top:12px"><b style="font-size:14px">Body: zarobené u nás vs. uplatnené u nás</b>'+
  '<div style="margin-top:10px;font-size:12px"><div class="flex-between"><span>Zarobené u nás (nákupy s eko voľbou)</span><b>'+fmt(earned)+' b</b></div><div class="bar" style="margin:4px 0 10px"><i style="width:'+Math.round(earned/eMax*100)+'%"></i></div>'+
  '<div class="flex-between"><span>Uplatnené u nás (zľavy)</span><b>'+fmt(redeemed)+' b</b></div><div class="bar" style="margin-top:4px"><i style="width:'+Math.round(redeemed/eMax*100)+'%;background:#f97316"></i></div></div>'+
  '<p class="hint" style="margin-top:10px">'+fmt(redeemed)+' b = '+eur(redeemed/CONFIG.pointsPerEur)+' zliav financuješ ty (zahrnuté v nákladoch). Body zarobené u nás (≈ '+eur(earned/CONFIG.pointsPerEur)+') zákazníci uplatnia v ktorejkoľvek partnerskej kaviarni – zľavu platí kaviareň, kde ju uplatnia.</p></div>'+
  '<div class="card"><b style="font-size:14px">Denný limit zliav</b><p class="hint" style="margin:2px 0 0">Koľko zliav z bodov denne prijmeš. Po dosiahnutí limitu sa zľavy u teba na daný deň pozastavia.</p>'+
  '<div class="stepper"><button data-limit="-5" aria-label="Znížiť limit o 5"'+(lim<=5?' disabled':'')+'>−</button><div class="sv" aria-live="polite">'+lim+'<small>zliav / deň</small></div><button data-limit="5" aria-label="Zvýšiť limit o 5"'+(lim>=100?' disabled':'')+'>+</button></div>'+
  '<div class="bar" style="margin-top:10px"><i style="width:'+Math.round(usedToday/lim*100)+'%;background:#f97316"></i></div><div class="flex-between sub" style="margin-top:6px;font-size:12px"><span>Dnes uplatnených: '+usedToday+' / '+lim+'</span><span>Limit: '+lim+'</span></div></div>'+
  '<div class="card" style="margin-top:12px"><b style="font-size:14px">Náklady vs. prínos (mesačne)</b>'+
  '<div style="margin-top:10px;font-size:12px"><div class="flex-between"><span>Náklady (poplatok + zľavy)</span><b>'+eur(cost)+'</b></div><div class="bar" style="margin:4px 0 10px"><i style="width:'+Math.round(cost/rev*100)+'%;background:#f97316"></i></div>'+
  '<div class="flex-between"><span>Prínos (marža z nových návštev + poháre)</span><b>'+eur(rev)+'</b></div><div class="bar" style="margin-top:4px"><i style="width:100%"></i></div></div></div>'+
  '<div class="card"><b style="font-size:14px">Špičkové hodiny (eko akcie)</b><svg viewBox="0 0 '+(hours.length*(bw+gap))+' '+(H+18)+'" width="100%" style="margin-top:10px;display:block">'+bars+'</svg></div>'+
  '<div class="card"><b style="font-size:14px">Top eko položky</b>'+tops.map(function(t){return '<div style="margin-top:9px;font-size:13px"><div class="flex-between"><span>'+t[0]+'</span><b>'+t[1]+' %</b></div><div class="bar" style="margin-top:4px"><i style="width:'+t[1]+'%"></i></div></div>';}).join("")+'</div>'+
  '<div class="card"><b style="font-size:14px">💡 Nápady od komunity</b><p style="font-size:13px;margin-top:8px;color:var(--ink2)">„Zľava aj na čaj vo vlastnom pohári“ · „Zálohované poháre pri pokladni“ · „Vegánsky croissant“</p><p class="hint">'+(S.ideaSent?'Nový návrh pribudol práve teraz.':'12 návrhov tento mesiac')+'</p></div>'+
  '<div class="note">🔒 <b>GDPR:</b> iba agregované dáta, žiadne osobné údaje bez súhlasu. Partner nevidí mená ani históriu nákupov jednotlivcov.</div></div>';
}

/* ============ RENDER + UDALOSTI ============ */
function render(){
  var m=$("#main");
  $("#nav").classList.toggle("hide",S.partner);
  if(S.partner){ m.innerHTML=viewPartner(); return; }
  renderNav();
  var v={home:viewHome,scan:viewScan,rewards:viewRewards,community:viewCommunity,transparency:viewTransparency}[S.tab]||viewHome;
  m.innerHTML=v();
}
document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("button,[data-show],.link,.toggle") : null;
  if(!t) return;
  if(t.id==="plusBtn" || t.hasAttribute("data-plusopen")){ openPlus(); return; }
  if(t.id==="plusClose"||t.id==="stayFree"){ closePlus(); $("#plusBtn").focus({preventScroll:true}); return; }
  if(t.id==="activatePlus"){ activatePlus(); return; }
  if(t.dataset.boost){ toggleBoost(t.dataset.boost); return; }
  if(t.dataset.com){ S.comTab=t.dataset.com; render(); return; }
  if(t.id==="addFriend"){ var f=S.friendPool.shift(); if(!f) return; f.isNew=true; S.friends.push(f); render(); toast("👋 "+f.n+" je teraz tvoj/a priateľ/ka"); return; }
  if(t.dataset.club){ var c=S.clubs.filter(function(x){return x.id===t.dataset.club;})[0]; c.joined=!c.joined; c.m+=c.joined?1:-1; render(); toast(c.joined?"Vitaj v klube "+c.n+" 🎉":"Opustila si klub "+c.n); return; }
  if(t.id==="createClub"){ if(!S.plus){ openPlus(); toast("Vytváranie klubov je Plus funkcia ✦"); return; } createClubForm(); return; }
  if(t.id==="clubSubmit"){ var nm=($("#clubName").value||"").trim(); if(nm.length<3){ toast("Zadaj názov klubu (3+ znaky)"); return; }
    S.clubs.push({id:"k"+(S.clubs.length+1),n:nm,ic:"⭐",m:1,goal:+$("#clubGoal").value,prog:0,joined:true,mine:true}); closeModal(); render(); confetti(); toast("Klub „"+nm+"“ vytvorený ✓"); return; }
  if(t.dataset.event){ var ev=S.events.filter(function(x){return x.id===t.dataset.event;})[0]; ev.going=!ev.going; ev.att+=ev.going?1:-1; render(); toast(ev.going?"✓ Si prihlásená na „"+ev.t+"“":"Účasť zrušená"); return; }
  if(t.id==="createEvent"){ if(!S.plus){ openPlus(); toast("Vlastné eventy sú Plus funkcia ✦"); return; } createEventForm(); return; }
  if(t.id==="evSubmit"){ submitEvent(); return; }
  if(t.dataset.limit){ var mm=$("#main"), st=mm.scrollTop; S.dailyLimit=Math.max(5,Math.min(100,S.dailyLimit+(+t.dataset.limit))); render(); mm.scrollTop=st; toast("Denný limit zliav: "+S.dailyLimit); return; }
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.id==="partnerToggle"){ togglePartner(); return; }
  if(t.id==="demoBtn"||t.id==="demoBtn2"){ var r=RECEIPTS[S.demoIdx%RECEIPTS.length]; S.demoIdx++; startVerify(r); return; }
  if(t.id==="camBtn"){ openCamera(); return; }
  if(t.id==="photoBtn"){ var qf=$("#qrFile"); if(qf){ qf.value=""; qf.click(); } return; }
  if(t.id==="ridBtn"){ handleCode($("#rid").value); return; }
  if(t.dataset.rid){ $("#rid").value=t.dataset.rid; return; }
  if(t.id==="againBtn"){ S.lastResult=null; render(); return; }
  if(t.dataset.lb){ S.lbMode=t.dataset.lb; render(); return; }
  if(t.id==="methodLink"){ showMethod(); return; }
  if(t.dataset.redeem){
    var v=[WELCOME].concat(VOUCHERS).filter(function(x){return x.id===t.dataset.redeem;})[0];
    if(!v||S.balance<v.cost) return;
    if(v.welcome){ if(S.welcomeUsed) return; S.welcomeUsed=true; }
    S.balance-=v.cost;
    var code="ZC-"+(hash(v.id+Date.now()+Math.random()).toString(36).toUpperCase().slice(0,6));
    var x={v:v,code:code}; S.redeemed.unshift(x); render(); showVoucher(x); toast(v.welcome?"Uvítací bonus aktivovaný 🎉":"−"+v.cost+" b · zľava aktivovaná 🎉"); return;
  }
  if(t.dataset.show!==undefined && t.dataset.show!==""){ showVoucher(S.redeemed[+t.dataset.show]); return; }
  if(t.id==="ideaBtn"){
    var txt=($("#ideaT").value||"").trim();
    if(txt.length<10){ toast("Napíš aspoň krátku vetu (10+ znakov) ✍️"); return; }
    S.ideaPartner=$("#ideaP").value; S.ideaSent=true; S.balance+=CONFIG.ideaPoints; S.lifetime+=CONFIG.ideaPoints; render(); confetti(); toast("+"+CONFIG.ideaPoints+" b za nápad · ďakujeme!"); return;
  }
});
function togglePartner(){
  S.partner=!S.partner; var tg=$("#partnerToggle"); tg.classList.toggle("on",S.partner); tg.setAttribute("aria-checked",String(S.partner));
  closeCamera(); closeModal(); closePlus(); render(); $("#main").scrollTop=0;
}
$("#partnerToggle").addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); togglePartner(); } });
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target && e.target.id==="rid"){ handleCode(e.target.value); }
  if(e.key==="Escape"){ if($("#modal")) closeModal(); else if($("#plusModal")){ closePlus(); $("#plusBtn").focus({preventScroll:true}); } }
  if((e.key==="Enter"||e.key===" ") && e.target && e.target.classList && e.target.classList.contains("link") && e.target.dataset.go){ e.preventDefault(); go(e.target.dataset.go); }
});
document.addEventListener("change",function(e){ if(e.target && e.target.id==="qrFile"){ decodePhoto(e.target.files && e.target.files[0]); } });
updatePlusPill();
render();
</script>
